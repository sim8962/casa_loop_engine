name: casa_loop_engine
description: "Préparation de boucles moto hors ligne sur iPad."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  maplibre_gl: 0.27.1
  path_provider: 2.1.6

  crypto: ^3.0.7
  get: ^4.7.3
  flutter_screenutil: ^5.9.3
  hexcolor: ^3.1.3
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  get_storage: ^2.1.1
  share_plus: 13.3.1

dev_dependencies:
  flutter_lints: ^6.0.0
  objectbox_generator: ^5.3.2
  build_runner: ^2.15.1

flutter:

  uses-material-design: true

  assets:
    - assets/data/places.json
    - assets/data/routes.json
